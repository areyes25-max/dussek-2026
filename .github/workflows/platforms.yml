# macOS and Windows: the plugin builds, its UI tests pass, the standalone renders (macOS: universal, the
# Intel half run under Rosetta too; the AudioUnits through auval). Only where the
# plugin, the engine or this file changed (on main, a pull request, or by hand from the Actions tab).
name: Platforms

on:
  push:
    branches: [main]
    paths: ["plugin/**", "engine/**", "justfile", ".github/workflows/platforms.yml"]
  pull_request:
    paths: ["plugin/**", "engine/**", "justfile", ".github/workflows/platforms.yml"]
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing script before a pipe fails its step

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin   # the universal build's two chips
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Build the plugin (and the engine)
        run: just plugin
      - name: Rosetta (the Intel half runs on this Apple silicon runner)
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: The plugin's UI tests (each chip)
        run: |
          plugin/build/ui_tests
          arch -x86_64 plugin/build/ui_tests
      - name: The AudioUnits pass auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for p in dussek weidinger; do
            cp -R plugin/build/bin/$p.component ~/Library/Audio/Plug-Ins/Components/
            codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/$p.component
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep Ccrs
          for id in "aumu Dsek Ccrs" "aumu Wdgr Ccrs"; do
            auval -v $id > auval.txt 2>&1 || { tail -n 60 auval.txt; exit 1; }
            grep -q "AU VALIDATION SUCCEEDED" auval.txt || { tail -n 60 auval.txt; exit 1; }
          done
      - name: The standalone renders (Intel too)
        run: |
          bin=plugin/build/bin/dussek
          [ -e "$bin" ] || [ -e "$bin.exe" ] || bin=plugin/build/bin/dussek.app/Contents/MacOS/dussek
          "$bin" render instruments/grand_a albums/demos/midi/03-glass-rain.mid render.wav --tail 1 2>&1 | tee render.txt
          test -s render.wav
          grep -q "rendered in" render.txt   # its report reaches a pipe (Windows: a window program)
          # Weidinger's too (built beside it, not packaged)
          bin=plugin/build/bin/weidinger
          [ -e "$bin" ] || [ -e "$bin.exe" ] || bin=plugin/build/bin/weidinger.app/Contents/MacOS/weidinger
          "$bin" render instruments/trumpet albums/demos/midi/03-glass-rain.mid wrender.wav --tail 1 2>&1 | tee wrender.txt
          test -s wrender.wav
          grep -q "rendered in" wrender.txt
          # the Intel half under Rosetta: the engine's x86_64 code
          bin=plugin/build/bin/dussek
          [ -e "$bin" ] || bin=plugin/build/bin/dussek.app/Contents/MacOS/dussek
          arch -x86_64 "$bin" render instruments/grand_a albums/demos/midi/03-glass-rain.mid render-x86.wav --tail 1
          test -s render-x86.wav
      # a build to try on another machine (Actions tab: the run's artifacts; kept 3 days)
      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          out=$(plugin/tools/package.sh macos | tail -n 1)
          tar -C dist -czf dist/dussek-macos.tar.gz "$(basename "$out")"   # tar keeps the executables' mode
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: dussek-macos.tar.gz
          path: dist/dussek-macos.tar.gz
          archive: false   # the tarball itself, not a zip around it
          retention-days: 3

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64, MSYS2's own Rust built against the same C runtime (MINGW64 is deprecated)
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-python
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: The toolchain
        run: |
          which cargo rustc gcc
          rustc -vV
      - name: Build the plugin (and the engine)
        run: just plugin
      - name: The plugin's UI tests
        run: plugin/build/ui_tests
      - name: The standalone renders
        run: |
          set -o pipefail
          bin=plugin/build/bin/dussek
          [ -e "$bin" ] || [ -e "$bin.exe" ] || bin=plugin/build/bin/dussek.app/Contents/MacOS/dussek
          "$bin" render instruments/grand_a albums/demos/midi/03-glass-rain.mid render.wav --tail 1 2>&1 | tee render.txt
          test -s render.wav
          grep -q "rendered in" render.txt   # its report reaches a pipe (Windows: a window program)
          # Weidinger's too (built beside it, not packaged)
          bin=plugin/build/bin/weidinger
          [ -e "$bin" ] || [ -e "$bin.exe" ] || bin=plugin/build/bin/weidinger.app/Contents/MacOS/weidinger
          "$bin" render instruments/trumpet albums/demos/midi/03-glass-rain.mid wrender.wav --tail 1 2>&1 | tee wrender.txt
          test -s wrender.wav
          grep -q "rendered in" wrender.txt
      - name: Only the system's DLLs imported
        run: |
          set -o pipefail
          # linked statically (plugin/CMakeLists.txt): no MinGW runtime needed on the player's machine
          for f in plugin/build/bin/dussek.exe $(find plugin/build/bin -name '*.dll' -o -name '*.vst3' -type f -o -name '*.clap' -type f); do
            [ -f "$f" ] || continue
            if objdump -p "$f" | grep -i 'DLL Name' | grep -Ei 'libstdc|libgcc|libwinpthread|libc\+\+'; then
              echo "$f needs a MinGW runtime DLL"; exit 1
            fi
          done
      # a build to try on another machine (Actions tab: the run's artifacts; kept 3 days)
      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          out=$(plugin/tools/package.sh windows | tail -n 1)
          mv "$out" dist/dussek-windows
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: dussek-windows
          path: dist/dussek-windows
          retention-days: 3
