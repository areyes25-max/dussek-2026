[package]
name = "dussek-editor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "The instrument editor: projects, import and mapping, running the chain"
publish = false
build = "build.rs"

[lib]
name = "pe_editor"
path = "src/lib.rs"

[[bin]]
name = "dussek-editor"
path = "src/main.rs"

[dependencies]
dussek = { path = "../engine" }
eframe = "0.37.0"
egui_extras = "0.37.0"
toml_edit = "0.25.19"
regex = "1.13.1"
glob = "0.3.4"
symphonia = { version = "0.6.1", features = ["all"] }
realfft = "3.5.1"
cpal = "0.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
libc = "0.2.191"
rfd = "0.18.0"

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"
